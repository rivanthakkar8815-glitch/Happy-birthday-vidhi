<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Happy Birthday Vidhi 🎂</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    overflow:hidden;
}

.card{
    background:white;
    padding:30px;
    border-radius:25px;
    text-align:center;
    width:90%;
    max-width:380px;
    box-shadow:0 20px 40px rgba(0,0,0,0.2);
    animation:float 3s ease-in-out infinite;
}

@keyframes float{
    0%{transform:translateY(0px);}
    50%{transform:translateY(-10px);}
    100%{transform:translateY(0px);}
}

h1{
    color:#ff4081;
    margin-bottom:10px;
}

p{
    color:#555;
    font-size:18px;
}

img{
    width:180px;
    margin:20px 0;
}

button{
    border:none;
    padding:12px 28px;
    border-radius:12px;
    background:#ff4081;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.08);
}

.confetti{
    position:fixed;
    width:10px;
    height:10px;
    background:red;
    top:-10px;
    animation:fall linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(360deg);
    }
}
</style>
</head>

<body>

<div class="card">
    <h1>Happy Birthday Vidhi 🎂💖</h1>

    <p>
        Wishing you endless happiness, love, success and lots of smiles today and always ✨💕
    </p>

    <img src="https://media.tenor.com/8zjoJw0W9f8AAAAi/birthday-cake.gif" alt="birthday">

    <br>

    <button onclick="celebrate()">Click for Surprise 🎁</button>
</div>

<script>
function celebrate(){

    document.body.innerHTML = `
    <div style="
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    font-family:Poppins,sans-serif;
    ">

    <h1 style="font-size:50px;">🎉 Happy Birthday Vidhi 🎂</h1>

    <p style="font-size:24px;max-width:600px;">
    May your day be filled with love, laughter, joy and beautiful memories 💕✨
    </p>

    <img src="https://media.tenor.com/JhR5M5N7wKQAAAAi/happy-birthday.gif" width="250">

    </div>
    `;

    for(let i=0;i<120;i++){
        let confetti=document.createElement('div');
        confetti.classList.add('confetti');

        confetti.style.left=Math.random()*100+'vw';
        confetti.style.background=
        `hsl(${Math.random()*360},100%,50%)`;

        confetti.style.animationDuration=
        (Math.random()*3+2)+'s';

        confetti.style.opacity=Math.random();

        confetti.style.width=
        confetti.style.height=
        (Math.random()*10+5)+'px';

        document.body.appendChild(confetti);
    }
}
</script>

</body>
</html>
